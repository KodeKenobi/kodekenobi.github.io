<div id="mp-command-overlay" style="display:none; position:fixed; inset:0; z-index:300; pointer-events:none;">
  <style>

    #mp-command-overlay {
      font-family: 'BlackOpsOne', 'Teko', 'Trebuchet MS', sans-serif;
      pointer-events: none;
    }

    #mp-command-overlay .mp-panel {
      position: absolute;
      left: 22px;
      top: 106px;
      width: 370px;
      border-radius: 18px;
      padding: 14px 14px 12px;
      background:
        linear-gradient(180deg, rgba(6, 14, 30, 0.92), rgba(5, 11, 23, 0.95)),
        radial-gradient(circle at 22% -8%, rgba(122, 226, 255, 0.2), transparent 56%);
      border: 2px solid rgba(120, 210, 255, 0.55);
      box-shadow:
        0 0 0 3px rgba(35, 62, 103, 0.62),
        0 0 22px rgba(62, 190, 255, 0.18),
        inset 0 0 20px rgba(42, 158, 255, 0.12);
      pointer-events: auto;
      overflow: hidden;
    }

    #mp-command-overlay.mp-compact .mp-panel {
      left: 18px;
      top: 88px;
      width: 254px;
      padding: 9px 10px 8px;
      border-radius: 12px;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(10, 18, 30, 0.84), rgba(6, 12, 20, 0.88)),
        radial-gradient(circle at 30% 0%, rgba(116, 218, 255, 0.16), transparent 58%);
      box-shadow:
        0 0 0 2px rgba(35, 62, 103, 0.5),
        0 0 16px rgba(62, 190, 255, 0.12),
        inset 0 0 12px rgba(42, 158, 255, 0.08);
    }

    #mp-command-overlay.mp-compact .mp-panel::before {
      inset: 6px;
      border-radius: 9px;
    }

    #mp-command-overlay.mp-compact .mp-title {
      font-size: 13px;
      margin-bottom: 5px;
      letter-spacing: 0.8px;
      color: #d8f2ff;
    }

    #mp-command-overlay.mp-compact .mp-chip-row {
      margin-bottom: 6px;
      gap: 4px;
    }

    #mp-command-overlay.mp-compact .mp-chip {
      font-size: 9px;
      padding: 3px 7px;
    }

    #mp-command-overlay.mp-compact .mp-block {
      margin-bottom: 0;
      padding: 6px;
      background: linear-gradient(180deg, rgba(10, 20, 35, 0.72), rgba(7, 14, 26, 0.82));
    }

    #mp-command-overlay.mp-compact .mp-label {
      font-size: 8px;
      margin-bottom: 4px;
    }

    #mp-command-overlay.mp-compact .mp-threat-value {
      font-size: 20px;
    }

    #mp-command-overlay.mp-compact .mp-threat-meta {
      font-size: 10px;
    }

    #mp-command-overlay.mp-compact .mp-meter {
      height: 9px;
    }

    #mp-command-overlay.mp-compact .mp-footer {
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 0.4px;
    }

    #mp-command-overlay.mp-compact .mp-block:nth-of-type(2),
    #mp-command-overlay.mp-compact .mp-block:nth-of-type(3) {
      display: none;
    }

    #mp-command-overlay .mp-panel::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(117, 216, 255, 0.26);
      border-radius: 12px;
      pointer-events: none;
    }

    #mp-command-overlay .mp-title {
      font-size: 18px;
      letter-spacing: 1.2px;
      font-weight: 800;
      color: #e8f8ff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(78, 208, 255, 0.38);
      margin-bottom: 10px;
    }

    #mp-command-overlay .mp-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    #mp-command-overlay .mp-chip {
      border: 1px solid rgba(114, 197, 240, 0.48);
      background: linear-gradient(180deg, rgba(18, 42, 72, 0.94), rgba(10, 26, 45, 0.96));
      border-radius: 999px;
      padding: 4px 10px;
      color: #d5efff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1;
    }

    #mp-command-overlay .mp-chip[data-kind="role"] {
      color: #ffd69e;
      border-color: rgba(255, 199, 131, 0.5);
    }

    #mp-command-overlay .mp-block {
      margin-bottom: 10px;
      border: 1px solid rgba(93, 151, 198, 0.44);
      background: linear-gradient(180deg, rgba(11, 22, 39, 0.84), rgba(9, 16, 28, 0.9));
      border-radius: 10px;
      padding: 8px;
    }

    #mp-command-overlay .mp-label {
      color: #93bad9;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #mp-command-overlay .mp-threat-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    #mp-command-overlay .mp-threat-value {
      font-size: 28px;
      color: #f0fbff;
      line-height: 1;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(122, 223, 255, 0.32);
    }

    #mp-command-overlay .mp-threat-meta {
      color: #9dd5f5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    #mp-command-overlay .mp-meter {
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(113, 184, 230, 0.56);
      background: rgba(7, 16, 28, 0.95);
      overflow: hidden;
      position: relative;
    }

    #mp-command-overlay .mp-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2f8ec6, #48d5ff 56%, #b9f2ff);
      box-shadow: 0 0 12px rgba(71, 213, 255, 0.45);
      transition: width 0.2s ease;
    }

    #mp-command-overlay .mp-route-row,
    #mp-command-overlay .mp-lane-row,
    #mp-command-overlay .mp-spawn-grid {
      display: grid;
      gap: 6px;
    }

    #mp-command-overlay .mp-route-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    #mp-command-overlay .mp-lane-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    #mp-command-overlay .mp-spawn-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 2px;
    }

    #mp-command-overlay .mp-btn {
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(104, 156, 203, 0.66);
      background: linear-gradient(180deg, #203349, #162638);
      color: #cfe6f8;
      font-family: 'BlackOpsOne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    #mp-command-overlay .mp-btn:hover {
      border-color: rgba(133, 211, 255, 0.96);
      color: #f2fbff;
      box-shadow: 0 0 10px rgba(82, 201, 255, 0.28);
    }

    #mp-command-overlay .mp-btn.is-active {
      border-color: rgba(138, 221, 255, 1);
      background: linear-gradient(180deg, #274f73, #1b3751);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(95, 213, 255, 0.35);
    }

    #mp-command-overlay .mp-btn[data-spawn="soldier"] {
      border-color: rgba(146, 211, 255, 0.65);
    }

    #mp-command-overlay .mp-btn[data-spawn="eliteSoldier"] {
      border-color: rgba(255, 214, 143, 0.7);
      color: #ffe8c1;
    }

    #mp-command-overlay .mp-btn[data-spawn="tank"] {
      border-color: rgba(255, 176, 134, 0.7);
      color: #ffd7be;
    }

    #mp-command-overlay .mp-btn[data-spawn="plane"] {
      border-color: rgba(183, 201, 255, 0.72);
      color: #dde8ff;
    }

    #mp-command-overlay .mp-btn[disabled] {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    #mp-command-overlay .mp-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      color: #95b7cf;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    #mp-command-overlay .mp-state {
      color: #8cd6ff;
    }

    @media (max-width: 1280px) {
      #mp-command-overlay .mp-panel {
        width: 332px;
        top: 98px;
      }
    }
  </style>

  <div class="mp-panel">
    <div class="mp-title">Multiplayer Command</div>
    <div class="mp-chip-row">
      <div class="mp-chip" data-kind="mode" data-mp="mode">Mode: Solo</div>
      <div class="mp-chip" data-kind="role" data-mp="role">Role: Defender</div>
      <div class="mp-chip" data-kind="timer" data-mp="timer">Wave: --:--</div>
    </div>

    <div class="mp-block">
      <div class="mp-label">Bounty Budget</div>
      <div class="mp-threat-head">
        <div class="mp-threat-value" data-mp="threat-value">0</div>
        <div class="mp-threat-meta" data-mp="threat-meta">Combat earnings</div>
      </div>
      <div class="mp-meter">
        <div class="mp-meter-fill" data-mp="threat-fill"></div>
      </div>
    </div>

    <div class="mp-block">
      <div class="mp-label">Route Control</div>
      <div class="mp-route-row" data-mp="routes"></div>
      <div class="mp-label" style="margin-top: 8px;">Plane Lane</div>
      <div class="mp-lane-row" data-mp="lanes">
        <button class="mp-btn" type="button" data-lane="top">Top</button>
        <button class="mp-btn" type="button" data-lane="middle">Middle</button>
        <button class="mp-btn" type="button" data-lane="bottom">Bottom</button>
      </div>
    </div>

    <div class="mp-block">
      <div class="mp-label">Deploy Units</div>
      <div class="mp-spawn-grid">
        <button class="mp-btn" type="button" data-spawn="soldier">Soldier  8</button>
        <button class="mp-btn" type="button" data-spawn="eliteSoldier">Elite  20</button>
        <button class="mp-btn" type="button" data-spawn="tank">Tank  28</button>
        <button class="mp-btn" type="button" data-spawn="plane">Plane  24</button>
      </div>
    </div>

    <div class="mp-footer">
      <div class="mp-state" data-mp="state">Waiting for wave</div>
      <div data-mp="queue">Queued: 0</div>
    </div>
  </div>
</div>
