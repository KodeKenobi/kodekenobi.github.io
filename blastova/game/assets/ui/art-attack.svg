<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3d50"/>
      <stop offset="100%" stop-color="#0d1820"/>
    </linearGradient>
    <linearGradient id="turret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#32465a"/>
      <stop offset="100%" stop-color="#14242e"/>
    </linearGradient>
    <radialGradient id="redglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3010" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    #mf  { animation: muzzle 3.5s .8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes muzzle { 0%,68%,100%{opacity:.35;transform:scale(1)} 75%{opacity:.95;transform:scale(1.8)} 83%{opacity:.6;transform:scale(2.4)} 92%{opacity:.18;transform:scale(1.1)} }
    #si  { animation: sbeat 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes sbeat { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.7);opacity:1} }
    #al  { animation: ablink 4.5s  .3s ease-in-out infinite; }
    #ar  { animation: ablink 4.5s 1.1s ease-in-out infinite; }
    @keyframes ablink { 0%,76%,100%{opacity:.9} 82%{opacity:.06} 90%{opacity:.82} 96%{opacity:.22} }
    #ex  { animation: exhaust 1.8s ease-in-out infinite; }
    @keyframes exhaust { 0%,100%{transform:translateY(0);opacity:.45} 50%{transform:translateY(-7px);opacity:.72} }
    #ws1,#ws2,#ws3 { animation: wspin 1.8s linear infinite; transform-box:fill-box; transform-origin:center; }
    #ws4,#ws5      { animation: wspin 1.6s .2s linear infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes wspin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  </style>

  <!-- Ground shadow -->
  <ellipse cx="162" cy="170" rx="140" ry="7" fill="#000" opacity="0.5"/>

  <!-- Red underglow -->
  <ellipse cx="162" cy="138" rx="100" ry="18" fill="url(#redglow)" opacity="0.5"/>

  <!-- Track assembly -->
  <path d="M28 118 Q26 158 52 160 L268 160 Q294 158 292 118 L292 118 Z" fill="#09121c"/>
  <!-- Track tread lines -->
  <line x1="60"  y1="120" x2="60"  y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="90"  y1="120" x2="90"  y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="150" y1="120" x2="150" y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="180" y1="120" x2="180" y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="210" y1="120" x2="210" y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="240" y1="120" x2="240" y2="158" stroke="#14202c" stroke-width="2"/>
  <line x1="268" y1="120" x2="268" y2="158" stroke="#14202c" stroke-width="2"/>
  <!-- Track border -->
  <path d="M28 118 Q26 158 52 160 L268 160 Q294 158 292 118" fill="none" stroke="#1c2e3e" stroke-width="2"/>
  <!-- Drive wheels -->
  <circle cx="52"  cy="138" r="20" fill="#111e2a" stroke="#1c2e3e" stroke-width="2"/>
  <circle cx="52"  cy="138" r="9"  fill="#0a1420"/>
  <circle cx="160" cy="138" r="24" fill="#111e2a" stroke="#1c2e3e" stroke-width="2.5"/>
  <circle cx="160" cy="138" r="11" fill="#0a1420"/>
  <circle cx="268" cy="138" r="20" fill="#111e2a" stroke="#1c2e3e" stroke-width="2"/>
  <circle cx="268" cy="138" r="9"  fill="#0a1420"/>
  <!-- Small road wheels -->
  <circle cx="106" cy="144" r="10" fill="#111e2a" stroke="#1c2e3e" stroke-width="1.5"/>
  <circle cx="214" cy="144" r="10" fill="#111e2a" stroke="#1c2e3e" stroke-width="1.5"/>
  <!-- Rotating spokes — absolute coords so fill-box centers correctly -->
  <g id="ws1">
    <line x1="52" y1="120" x2="52" y2="156" stroke="#253545" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="138" x2="70"  y2="138" stroke="#253545" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="39" y1="125" x2="65" y2="151" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="125" x2="39" y2="151" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="ws2">
    <line x1="160" y1="116" x2="160" y2="160" stroke="#253545" stroke-width="3" stroke-linecap="round"/>
    <line x1="138" y1="138" x2="182" y2="138" stroke="#253545" stroke-width="3" stroke-linecap="round"/>
    <line x1="143" y1="121" x2="177" y2="155" stroke="#1e2c3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="177" y1="121" x2="143" y2="155" stroke="#1e2c3a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="ws3">
    <line x1="268" y1="120" x2="268" y2="156" stroke="#253545" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="250" y1="138" x2="286" y2="138" stroke="#253545" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="255" y1="125" x2="281" y2="151" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="281" y1="125" x2="255" y2="151" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="ws4">
    <line x1="106" y1="135" x2="106" y2="153" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="97"  y1="144" x2="115" y2="144" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="137" x2="112" y2="151" stroke="#182433" stroke-width="1" stroke-linecap="round"/>
    <line x1="112" y1="137" x2="100" y2="151" stroke="#182433" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g id="ws5">
    <line x1="214" y1="135" x2="214" y2="153" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="205" y1="144" x2="223" y2="144" stroke="#1e2c3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="208" y1="137" x2="220" y2="151" stroke="#182433" stroke-width="1" stroke-linecap="round"/>
    <line x1="220" y1="137" x2="208" y2="151" stroke="#182433" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Hull body -->
  <path d="M48 120 L58 78 L262 78 L274 120 Z" fill="url(#hull)"/>
  <!-- Hull armour seam lines -->
  <line x1="58"  y1="78"  x2="48"  y2="120" stroke="#1e3040" stroke-width="1.5"/>
  <line x1="262" y1="78"  x2="274" y2="120" stroke="#0d1a24" stroke-width="1.5"/>
  <line x1="100" y1="78"  x2="100" y2="120" stroke="#1a2a38" stroke-width="1"/>
  <line x1="160" y1="78"  x2="160" y2="120" stroke="#1a2a38" stroke-width="1"/>
  <line x1="220" y1="78"  x2="220" y2="120" stroke="#1a2a38" stroke-width="1"/>
  <!-- Hull top edge highlight -->
  <line x1="58" y1="78" x2="262" y2="78" stroke="#2e4050" stroke-width="1.5"/>

  <!-- Turret platform -->
  <path d="M105 80 L115 62 L215 62 L218 80 Z" fill="#12222e"/>

  <!-- Turret body -->
  <path d="M108 80 Q108 52 160 48 Q212 52 215 80 Z" fill="url(#turret)"/>
  <path d="M108 80 Q108 52 160 48 Q212 52 215 80" fill="none" stroke="#2e4458" stroke-width="1.5"/>

  <!-- Hatch -->
  <ellipse cx="148" cy="52" rx="18" ry="7" fill="#1a2e3e" stroke="#2a3e50" stroke-width="1.5"/>
  <circle  cx="148" cy="50" r="5" fill="#0d1820" stroke="#3a5468" stroke-width="1"/>
  <circle  cx="148" cy="50" r="2" fill="#ff2000" opacity="0.8" filter="url(#glow)"/>

  <!-- Barrel -->
  <rect x="215" y="63" width="96" height="15" rx="4" fill="#14222e"/>
  <rect x="215" y="65" width="96" height="11" rx="3" fill="#0f1c28"/>
  <!-- Barrel reinforcement rings -->
  <rect x="232" y="63" width="5"  height="15" rx="1" fill="#0a1420"/>
  <rect x="256" y="63" width="5"  height="15" rx="1" fill="#0a1420"/>
  <rect x="280" y="63" width="5"  height="15" rx="1" fill="#0a1420"/>
  <!-- Muzzle brake -->
  <rect x="306" y="58" width="14" height="25" rx="3" fill="#0d1820"/>
  <rect x="306" y="58" width="14" height="25" rx="3" fill="none" stroke="#ff3010" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
  <!-- Muzzle flash glow -->
  <ellipse id="mf" cx="320" cy="70" rx="12" ry="8" fill="#ff4020" opacity="0.35" filter="url(#softglow)"/>

  <!-- Targeting sensor on turret side -->
  <circle cx="213" cy="64" r="7" fill="#0d1820" stroke="#ff2a10" stroke-width="1.5" filter="url(#glow)"/>
  <circle id="si" cx="213" cy="64" r="3" fill="#ff2a10" opacity="0.9"/>

  <!-- Red hull accent strips -->
  <rect id="al" x="60"  y="88" width="18" height="5" rx="2" fill="#cc2200" opacity="0.9" filter="url(#glow)"/>
  <rect id="ar" x="240" y="88" width="18" height="5" rx="2" fill="#cc2200" opacity="0.9" filter="url(#glow)"/>

  <!-- Exhaust heat shimmer -->
  <path id="ex" d="M222 69 Q226 57 224 46 Q229 58 230 46 Q228 57 234 46" stroke="#ff4422" stroke-width="1.2" fill="none" opacity="0.45"/>
</svg>
