<style>
  .bp-overlay {
    position: fixed;
    inset: 0;
    z-index: 1300;
    pointer-events: none;
  }

  .bp-overlay.is-open {
    pointer-events: auto;
  }

  .bp-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(3, 12, 24, 0.44);
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 220ms ease;
  }

  .bp-overlay.is-open .bp-backdrop {
    opacity: 1;
  }

  .bp-sheet {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    border-radius: 16px;
    border: 1px solid rgba(111, 201, 255, 0.45);
    background: rgba(6, 15, 28, 0.82);
    box-shadow: 0 20px 54px rgba(0, 0, 0, 0.56);
    overflow: hidden;
    transform: translateY(106%);
    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bp-overlay.is-open .bp-sheet {
    transform: translateY(0);
  }

  .bp-close {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    border: 0;
    border-radius: 0 0 8px 8px;
    background: rgba(30, 71, 108, 0.96);
    color: #f2fbff;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    min-width: 78px;
    padding: 4px 10px;
    box-shadow: none;
    outline: none;
    cursor: pointer;
  }

  .bp-close:hover {
    background: rgba(39, 88, 133, 0.96);
  }

  .bp-viewport {
    width: 100%;
    height: 100%;
    margin-top: 0;
    overflow: hidden;
    position: relative;
    background: #041022;
  }

  .bp-iframe {
    position: absolute;
    inset: 0;
    width: 128.3%;
    height: 128.3%;
    border: none;
    display: block;
    background: #041022;
    transform: scale(0.78);
    transform-origin: top left;
  }

  @media (max-width: 1280px), (max-height: 760px) {
    .bp-iframe {
      width: 142.9%;
      height: 142.9%;
      transform: scale(0.7);
    }
  }

  @media (max-width: 1024px), (max-height: 720px) {
    .bp-sheet {
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      border-radius: 0;
      border-width: 0;
    }

    .bp-close {
      min-width: 60px;
      padding: 4px 10px;
      font-size: 10px;
      letter-spacing: 0.6px;
    }

    .bp-iframe {
      width: 100%;
      height: 100%;
      transform: none;
    }
  }
</style>

<section class="bp-overlay is-closed" data-blueprints-overlay="true" aria-hidden="true">
  <div class="bp-backdrop" data-blueprints-backdrop="true"></div>
  <section class="bp-sheet" data-blueprints-sheet="true" role="dialog" aria-label="Blueprint Armory">
    <button class="bp-close" type="button" data-blueprints-close="true">CLOSE</button>
    <div class="bp-viewport">
      <iframe class="bp-iframe" src="about:blank" title="Tower Blueprints"></iframe>
    </div>
  </section>
</section>
