<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Icon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #1a1a1a;
        }
        svg {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <!-- Head (yellow) -->
        <circle cx="12" cy="7" r="3" fill="#ffd37a"/>
        <!-- Body (black) -->
        <ellipse cx="12" cy="14" rx="5" ry="6" fill="#000"/>
        <!-- Belly (yellow) -->
        <ellipse cx="12" cy="14" rx="3" ry="4" fill="#ffd37a"/>
        <!-- Eyes (white) -->
        <circle cx="9" cy="12" r="1" fill="#fff"/>
        <circle cx="15" cy="12" r="1" fill="#fff"/>
        <!-- Beak (red) -->
        <polygon points="12,15 11,17 13,17" fill="#ff6b6b"/>
        <!-- Feet (yellow) -->
        <line x1="8" y1="18" x2="7" y2="21" stroke="#ffd37a" stroke-width="1.5"/>
        <line x1="16" y1="18" x2="17" y2="21" stroke="#ffd37a" stroke-width="1.5"/>
    </svg>
</body>
</html>
